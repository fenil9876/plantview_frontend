services:
  frontend:
    # Run a prebuilt image. Build it first with the Dockerfile, baking in the
    # backend URL, e.g.:
    #   docker build --build-arg VITE_API_BASE_URL=https://your-api.onrender.com/api/v1 \
    #                -t plantview-frontend:latest .
    image: pf811/plantview-frontend:001
    container_name: plantview-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    # nginx serving static files needs almost nothing; cap it small.
    mem_limit: 64m
    mem_reservation: 16m
