# Minimal, self-contained nginx config for serving the PlantView SPA.
# Tuned for a tiny footprint: a single worker is plenty for static files.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Compress text assets on the way out (JS/CSS/JSON/SVG).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml font/woff2;

    server {
        listen      80;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Hashed build assets never change — cache them hard.
        location /assets/ {
            expires    1y;
            add_header  Cache-Control "public, immutable";
            try_files   $uri =404;
        }

        # Single-page app: route everything else through index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The HTML entry point must always be revalidated.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
